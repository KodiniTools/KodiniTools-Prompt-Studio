# Prompt-Studio unter https://kodinitools.com/promptgenerator/
#
# Einbinden im HTTPS-Server-Block von kodinitools.com:
#     include /etc/nginx/snippets/promptgenerator.conf;
#
# Der Passwortschutz liegt im Node-Server (Basic Auth, AUTH_PASSWORD in der .env),
# NICHT in dieser Datei. Er bleibt deshalb auch bestehen, wenn dieses Snippet
# überschrieben oder versehentlich entfernt wird. Nginx reicht den
# Authorization-Header unverändert durch.
#
# Bewusst kein add_header: es würde die add_header-Zeilen des Server-Blocks
# (z. B. HSTS) für diesen Pfad ausser Kraft setzen.

location = /promptgenerator { return 301 /promptgenerator/; }

location ^~ /promptgenerator/ {
    access_log off;                      # private App: keine Prompts/Pfade im Log
    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_read_timeout 200s;             # Turbo-Aufrufe dauern bis zu ~2 Minuten
    proxy_send_timeout 200s;
    proxy_buffering off;
    # Schrägstrich am Ende: /promptgenerator/x  ->  /x beim Node-Server
    proxy_pass http://127.0.0.1:3022/;
}
